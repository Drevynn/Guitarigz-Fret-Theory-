<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for Gradients -->
  <defs>
    <!-- Background circular gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    
    <!-- Gold/Amber metallic gradient for highlights -->
    <linearGradient id="gold-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Chrome/Steel metal gradient for strings -->
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    
    <!-- Glow effect filter -->
    <filter id="amber-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Circle Background -->
  <circle cx="256" cy="256" r="240" fill="url(#bg-glow)" stroke="#334155" stroke-width="4" />
  
  <!-- Outer Gold Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#gold-metal)" stroke-width="3" opacity="0.8" />

  <!-- Guitar Neck / Fretboard Wood -->
  <rect x="216" y="60" width="80" height="392" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="2" />

  <!-- Frets (Horizontal Lines) -->
  <line x1="216" y1="100" x2="296" y2="100" stroke="#475569" stroke-width="3" />
  <line x1="216" y1="160" x2="296" y2="160" stroke="#475569" stroke-width="3" />
  <line x1="216" y1="230" x2="296" y2="230" stroke="#475569" stroke-width="3" />
  <line x1="216" y1="310" x2="296" y2="310" stroke="#475569" stroke-width="3" />
  <line x1="216" y1="400" x2="296" y2="400" stroke="#475569" stroke-width="3" />

  <!-- Fret Markers (Pearloid Dots / Inlays) -->
  <!-- Single dot 3rd fret equivalent -->
  <circle cx="256" cy="130" r="5" fill="#e2e8f0" opacity="0.9" />
  <!-- Single dot 5th fret equivalent -->
  <circle cx="256" cy="195" r="5" fill="#e2e8f0" opacity="0.9" />
  <!-- Single dot 7th fret equivalent -->
  <circle cx="256" cy="270" r="5" fill="#e2e8f0" opacity="0.9" />
  <!-- Double dots 12th fret equivalent -->
  <circle cx="248" cy="355" r="4.5" fill="url(#gold-metal)" filter="url(#amber-glow)" />
  <circle cx="264" cy="355" r="4.5" fill="url(#gold-metal)" filter="url(#amber-glow)" />

  <!-- Guitar Strings (Vertical Lines) -->
  <line x1="226" y1="60" x2="226" y2="452" stroke="url(#steel)" stroke-width="3.5" />
  <line x1="238" y1="60" x2="238" y2="452" stroke="url(#steel)" stroke-width="2.8" />
  <line x1="250" y1="60" x2="250" y2="452" stroke="url(#steel)" stroke-width="2.2" />
  <line x1="262" y1="60" x2="262" y2="452" stroke="url(#steel)" stroke-width="1.8" />
  <line x1="274" y1="60" x2="274" y2="452" stroke="url(#steel)" stroke-width="1.4" />
  <line x1="286" y1="60" x2="286" y2="452" stroke="url(#steel)" stroke-width="1.0" />

  <!-- Chord Visualizer Overlay Nodes (Active Highlight Note) -->
  <circle cx="250" cy="270" r="14" fill="url(#gold-metal)" stroke="#ffffff" stroke-width="2" filter="url(#amber-glow)" />
  <text x="250" y="275" font-family="'Inter', sans-serif" font-weight="900" font-size="14" fill="#020617" text-anchor="middle">A</text>

  <circle cx="274" cy="195" r="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2" />
  <text x="274" y="199" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#fbbf24" text-anchor="middle">C#</text>
  
  <circle cx="226" cy="130" r="12" fill="#1e293b" stroke="#475569" stroke-width="2" />
  <text x="226" y="134" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#94a3b8" text-anchor="middle">E</text>

  <!-- Glowing Sound Waves / Vibration Lines -->
  <path d="M 170 216 Q 140 256 170 296" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.6" filter="url(#amber-glow)" />
  <path d="M 150 196 Q 110 256 150 316" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" opacity="0.3" filter="url(#amber-glow)" />
  
  <path d="M 342 216 Q 372 256 342 296" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.6" filter="url(#amber-glow)" />
  <path d="M 362 196 Q 402 256 362 316" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" opacity="0.3" filter="url(#amber-glow)" />
</svg>
